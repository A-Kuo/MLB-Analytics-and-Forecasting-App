name: Backfill roster history

# Roster history changes relatively infrequently. Run this monthly to refresh
# player bios, debuts, retirements, and franchise roster history. Use manual
# dispatch after events such as the trade deadline or when repairing a cache.
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch: {}

concurrency:
  group: roster-history-backfill
  cancel-in-progress: false

jobs:
  backfill-roster-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-backfill.txt

      - name: Install backfill dependencies
        run: pip install -r requirements-backfill.txt

      - name: Backfill roster history
        run: python scripts/backfill_roster_history.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
