name: Backfill roster history (On Demand)

# Roster history changes infrequently, so the normal all-time refresh runs
# monthly. workflow_dispatch allows targeted historical year ranges or one
# team to be refreshed manually.
on:
  schedule:
    - cron: "0 8 1 * *"

  workflow_dispatch:
    inputs:
      start_year:
        description: "Optional inclusive first season to process, e.g. 1901"
        required: false
        default: ""
        type: string
      end_year:
        description: "Optional inclusive final season to process, e.g. 2022"
        required: false
        default: ""
        type: string
      # team_id:
        # description: "Optional MLB team ID; leave blank to process all teams"
        # required: false
        # default: ""
        # type: string

concurrency:
  group: roster-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backfill dependencies
        run: pip install -r requirements-backfill.txt

      - name: Backfill roster history
        shell: bash
        run: |
          args=()

          if [ -n "${{ inputs.start_year }}" ]; then
            args+=(--start-year "${{ inputs.start_year }}")
          fi

          if [ -n "${{ inputs.end_year }}" ]; then
            args+=(--end-year "${{ inputs.end_year }}")
          fi

          if [ -n "${{ inputs.team_id }}" ]; then
            args+=(--team-id "${{ inputs.team_id }}")
          fi

          python scripts/backfill_roster_history.py "${args[@]}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
